<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="quiz">
      <p class="progress"></p>
      <p class="timer"></p>
      <h2 class="question"></h2>
      <ul class="answers"></ul>
      <p class="score"></p>
      <button class="btn-next">Next Question</button>
      <button class="btn-restart hidden">Try Again</button>
    </main>
    <script src="script.js" type="module"></script>
  </body>
</html>
